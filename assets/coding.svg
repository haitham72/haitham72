<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <style>
    @keyframes cursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes code {
      0% { opacity: 0; }
      10% { opacity: 1; }
      20% { opacity: 0; }
      30% { opacity: 1; }
      40% { opacity: 0; }
      50% { opacity: 1; }
      60% { opacity: 0; }
      70% { opacity: 1; }
      80% { opacity: 0; }
      90% { opacity: 1; }
      100% { opacity: 0; }
    }
    .cursor {
      animation: cursor 1s infinite;
    }
    .code-line {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      fill: #c9d1d9;
    }
    .keyword { fill: #ff7b72; }
    .string { fill: #a5d6ff; }
    .function { fill: #d2a8ff; }
    .comment { fill: #8b949e; }
  </style>
  <rect width="800" height="300" fill="#0d1117"/>
  <text x="30" y="40" class="code-line">
    <tspan class="keyword">from</tspan> <tspan class="function">langgraph</tspan> <tspan class="keyword">import</tspan> <tspan class="function">StateGraph</tspan>
  </text>
  <text x="30" y="70" class="code-line">
    <tspan class="keyword">from</tspan> <tspan class="function">rag</tspan> <tspan class="keyword">import</tspan> <tspan class="function">HybridRetriever</tspan>
  </text>
  <text x="30" y="100" class="code-line">
    <tspan class="keyword">from</tspan> <tspan class="function">agents</tspan> <tspan class="keyword">import</tspan> <tspan class="function">ResearchAgent</tspan>
  </text>
  <text x="30" y="130" class="code-line" class="comment"># Production Arabic RAG System</text>
  <text x="30" y="160" class="code-line">
    <tspan class="function">workflow</tspan> = <tspan class="function">StateGraph</tspan>(<tspan class="function">AgentState</tspan>)
  </text>
  <text x="30" y="190" class="code-line">
    workflow.<tspan class="function">add_node</tspan>(<tspan class="string">"research"</tspan>, <tspan class="function">ResearchAgent</tspan>())
  </text>
  <text x="30" y="220" class="code-line">
    workflow.<tspan class="function">add_edge</tspan>(<tspan class="string">"research"</tspan>, <tspan class="string">"validator"</tspan>)
  </text>
  <text x="30" y="250" class="code-line">workflow.<tspan class="function">compile</tspan>()</text>
  <text x="30" y="280" class="code-line cursor">_</text>
</svg>
